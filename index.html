<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1046" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>MeowMaker</title>
    <!-- arcade-cabinet type: Fredoka for the chunky display bits, Nunito for UI text.
         Self-hosted rather than pulled from Google Fonts: a third-party request sits on
         the critical path to first paint, and fonts.googleapis.com is unreachable in
         some of the regions CrazyGames serves. The files live in src/fonts and the
         @font-face rules in style.css, so Vite fingerprints them and emits relative URLs;
         that also rules out preloading them from here, since the built names are hashed. -->
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <!-- Restart, in the left key that balances the settings button so the wordmark
             stays optically centred. A Home link used to live here and is gone for good —
             the game ships inside a CrazyGames iframe, where navigating away from
             index.html is broken and disallowed. -->
        <button class="icon-btn" id="topRestart" title="Start a new cat"
          aria-label="Start a new cat">
          <svg class="icon-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M20 12a8 8 0 1 1-2.34-5.66" />
              <path d="M20 4v4.5h-4.5" />
            </g>
          </svg>
        </button>
        <!-- swap the artwork at src/logo.png; it is bundled rather than served from
             public/ so the stylesheet can mask the wordmark with the same file -->
        <h1 class="logo">
          <img class="logo-img" src="./src/logo.png" alt="MeowMaker" onerror="this.remove()" />
          <span class="logo-text"><span class="logo-a">MEOW</span><span class="logo-b">MAKER</span></span>
        </h1>
        <button class="icon-btn" id="settings" title="Shortcuts" aria-label="Shortcuts">
          <svg class="icon-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"
              d="M10.8946 3.00654C10.2226 1.87704 8.75191 1.45656 7.59248 2.14193L5.86749 3.12906C4.59518 3.85639 4.16378 5.48726 4.8906 6.74522L4.89112 6.74611C5.26606 7.39298 5.20721 7.8062 5.09018 8.00929C4.97308 8.21249 4.64521 8.47001 3.9 8.47001C2.43322 8.47001 1.25 9.66837 1.25 11.12V12.88C1.25 14.3317 2.43322 15.53 3.9 15.53C4.64521 15.53 4.97308 15.7875 5.09018 15.9907C5.20721 16.1938 5.26606 16.607 4.89112 17.2539L4.8906 17.2548C4.16378 18.5128 4.59558 20.1439 5.8679 20.8712L7.59257 21.8581C8.75199 22.5434 10.2226 22.123 10.8946 20.9935L11.0091 20.7958C11.3841 20.1489 11.773 19.9925 12.0087 19.9925C12.2434 19.9925 12.6293 20.1476 12.9993 20.793L13.0009 20.7958L13.1109 20.9858L13.1154 20.9935C13.7874 22.123 15.258 22.5434 16.4174 21.8581L18.1425 20.871C19.4157 20.1431 19.8444 18.5235 19.1212 17.2579L19.1189 17.2539C18.7439 16.607 18.8028 16.1938 18.9198 15.9907C19.0369 15.7875 19.3648 15.53 20.11 15.53C21.5768 15.53 22.76 14.3317 22.76 12.88V11.12C22.76 9.65323 21.5616 8.47001 20.11 8.47001C19.3648 8.47001 19.0369 8.21249 18.9198 8.00929C18.8028 7.8062 18.7439 7.39298 19.1189 6.74611L19.1194 6.74522C19.8463 5.48713 19.4147 3.85604 18.1421 3.12883L16.4175 2.14193C15.2581 1.45656 13.7874 1.877 13.1154 3.00651L13.0009 3.20423C12.6259 3.85115 12.237 4.00751 12.0012 4.00751C11.7666 4.00751 11.3807 3.85247 11.0107 3.20701L11.0091 3.20423L10.8991 3.01421L10.8946 3.00654ZM15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z" />
          </svg>
        </button>
      </header>

      <section class="stage">
        <div class="canvas busy" id="canvas">
          <div class="art" id="art"></div>
          <div class="spinner" aria-hidden="true"></div>
        </div>

        <div class="serial" id="serialPlate">
          <span>Your cat</span>
          <b id="serial">#00000</b>
        </div>
      </section>

      <section class="picker">
        <div class="progress" id="progress"><i id="progressFill"></i></div>
        <nav class="tabs" id="tabs"></nav>
        <div class="toolbar" id="toolbar"></div>
        <div class="grid" id="grid"></div>
      </section>

      <footer class="dock">
        <!-- the shutter: dark until every category has been styled, then it lights up
             and saves the finished cat -->
        <button class="dock-btn" id="dockShot" title="Finish styling first"
          aria-label="Save photo" disabled>
          <svg class="dock-cam" viewBox="0 0 48 48" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round">
              <path d="M6 17h8l3.5-5h13L34 17h8a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H6a2 2
                0 0 1-2-2V19a2 2 0 0 1 2-2Z" />
              <circle cx="24" cy="28" r="7.5" />
            </g>
          </svg>
        </button>
      </footer>
    </main>

    <!-- the camera flash: a white sheet that blinks once when the shutter fires, so
         saving the cat feels like a photo being taken rather than a file download -->
    <div class="flash" id="flash" aria-hidden="true"></div>

    <div class="toast" id="toast" role="status"></div>

    <audio id="music" src="./music-loop.mp3" loop preload="auto"></audio>

    <!-- native <dialog>: Esc-to-close and the backdrop come for free -->
    <dialog class="sheet" id="settingsSheet" aria-labelledby="sheetTitle">
      <h2 class="sheet-title" id="sheetTitle">Settings</h2>

      <!-- Both audio rows draw one icon in both states and let CSS strike it through when
           the switch is off, rather than swapping in a second "muted" drawing — the mark
           stays put and only gains a slash, which is easier to read at a glance than two
           silhouettes that differ subtly. The layered opacities are part of the artwork:
           they're the sound waves and the second note, so they're kept as authored. -->

        </span>
        <span class="sheet-label">Music</span>
        <span class="switch" aria-hidden="true"><i></i></span>
      </button>

      <!-- separate from Music on purpose: players who turn the loop off often still want
           the taps and the shutter, and vice versa -->
      <button class="sheet-row" id="soundToggle" aria-pressed="false">
        <span class="sheet-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">

        </span>
        <span class="sheet-label">Sound effects</span>
        <span class="switch" aria-hidden="true"><i></i></span>
      </button>

      <p class="sheet-keys">← → move between categories</p>

      <!-- Privacy Policy / Terms links belong here and are one of the few outbound links
           CrazyGames permits — but only once they point at pages that actually exist.
           The placeholders that used to sit here were dead links, so they are gone until
           there are real ones to link to. -->

      <button class="sheet-close" id="sheetClose">Close</button>
    </dialog>

    <div class="boot" id="boot">
      <div class="boot-card">
        <div class="boot-logo">
          <img class="logo-img" src="./src/logo.png" alt="MeowMaker" onerror="this.remove()" />
          <span class="logo-text"><span class="logo-a">MEOW</span><span class="logo-b">MAKER</span></span>
        </div>
        <div class="boot-sub" id="bootSub">Loading parts…</div>
        <div class="bar"><div class="bar-fill" id="bootBar"></div></div>
        <div class="boot-row">
          <span class="boot-count" id="bootCount">0 / 0</span>
        </div>
        <!-- only shown when a half-built cat is waiting in storage -->
        <div class="boot-choice" id="bootChoice" hidden>
          <button class="primary" id="bootContinue">▶ Continue</button>
          <button id="bootFresh">✨ Start fresh</button>
        </div>
      </div>
    </div>
    <!-- CrazyGames SDK: loaded ahead of the module so window.CrazyGames exists by the
         time main.js runs. It is only reachable on the portal — everywhere else this
         404s or is blocked, and the game carries on without it. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
